name: Create Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      # Do the release checkout
      - name: Clone Project
        uses: actions/checkout@v1
      - name: Get Tag
        id: vars
        #run: |
          #echo ::set-output name=tag::${GITHUB_REF#refs/*/}
          #echo ::set-output name=oldtag::$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1))
        run: |
            echo "tag=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
            echo "oldtag=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1))" >> $GITHUB_ENV
      # Make a zip file for GitHub
      - name: Archive Release
        uses: thedoctor0/zip-release@master
        with:
          filename: HeroLib-${{ env.tag }}.zip
          exclusions: '*.git* *.pkgmeta *.svn* .editorconfig LICENSE README.md symlink.bat symlink.sh'
      # Create a release on GitHub
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: HeroLib
          body: |
            Changes: https://github.com/herotc/hero-lib/compare/${{ env.oldtag }}...${{ env.tag }}
          draft: false
          prerelease: false
      # Upload the zip to the GitHub release
      - name: Upload Zip
        id: upload-zip
        uses: shogo82148/actions-upload-release-asset@v1.6.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./HeroLib-${{ env.tag }}.zip
          asset_name: HeroLib-${{ env.tag }}.zip
          asset_content_type: application/zip
      # Use the BigWigs packager for Wago output
      - name: Create Package
        uses: BigWigsMods/packager@master
        env:
            WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        with:
            args: -g retail -a 96E71aGg -n "${{ env.tag }}"